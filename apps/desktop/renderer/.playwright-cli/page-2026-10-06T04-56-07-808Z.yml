              - text: "\"没有竞品做。"
            - paragraph [ref=e1228]:
              - strong [ref=e1229]: 3. 隐私路由引擎
              - text: 规则引擎已存在，扩展一层：敏感文件路径/PII 检测 → 自动路由到本地模型（Ollama），普通任务走云端。"
