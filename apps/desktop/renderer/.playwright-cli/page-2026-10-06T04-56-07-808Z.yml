            - paragraph [ref=e1231]:
              - strong [ref=e1232]: 4. 预算守卫
              - text: 预算树已在 subagent 里实现，上浮到用户层：会话/每日硬预算，超限自动降级到便宜模型或暂停审批。"花 5 块钱跑完这个任务"是确定性的。
            - paragraph [ref=e1233]:
              - strong [ref=e1234]: 5. 录制/回放调试器（Agent VCR）
              - text: 事件溯源天然支持：录制一次会话 → mock provider 确定性重放 → 步进调试每次工具调用 → 回归测试 agent 行为。配合 evals 形成"agent 回归测试"闭环，开发者工具属性极强。
