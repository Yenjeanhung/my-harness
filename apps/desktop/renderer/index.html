    <title>Y Harness</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      ::-webkit-scrollbar { width: 7px; height: 7px; }
      ::-webkit-scrollbar-thumb { background: #2f3740; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #444d56; }
      ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
      body {
        margin: 0; background: #111318; color: #d7dae0;
        font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px;
        overflow: hidden;
      }
      button { background: #21262d; color: #d7dae0; border: 1px solid #30363d; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
      button:hover { background: #30363d; }
      input, select, textarea { font-family: inherit; }
      select, select option { background: #161921; color: #d7dae0; }
      select { border: 1px solid #30363d; border-radius: 6px; outline: none; }

      /* —— 工作区布局 —— */
      .root { display: flex; flex-direction: column; height: 100vh; }
      /* 自绘顶栏（titleBarStyle:hidden 后页面从顶部开始）：按住拖动窗口，右侧面板开关不参与拖拽；
         宽度用 titlebar-area 让出右上角系统窗口控制钮（WCO）的区域 */
      .titlebar {
        flex: none; height: 36px; display: flex; align-items: center; gap: 8px;
        padding: 0 6px 0 14px; background: #111318; border-bottom: 1px solid #262a33;
        -webkit-app-region: drag; user-select: none;
        width: env(titlebar-area-width, 100%);
        margin-left: env(titlebar-area-x, 0);
      }
      .tb-title { font-size: 12.5px; font-weight: 600; color: #8b949e; }
      .titlebar .panel-toggles { margin-left: auto; -webkit-app-region: no-drag; }
      /* 模式切换（Y Harness 右侧）：会话/代码模式一键互切 */
      .titlebar .mode-switch {
        -webkit-app-region: no-drag;
        width: 28px; height: 28px; margin-left: 10px; flex: none;
        display: inline-flex; align-items: center; justify-content: center;
        background: transparent; border: none; border-radius: 7px;
        color: #a9b4bf; cursor: pointer;
      }
      .titlebar .mode-switch:hover { color: #e6edf3; background: #1c2230; }
      /* 切换时半填充圆翻转半圈入场 = 「翻到另一面」 */
      .titlebar .mode-switch svg { animation: modespin 0.4s cubic-bezier(0.3, 0.7, 0.2, 1); }
      @keyframes modespin {
        from { transform: rotate(-180deg) scale(0.7); opacity: 0.2; }
        to { transform: rotate(0deg) scale(1); opacity: 1; }
      }
      /* —— 顶栏菜单栏（VS Code 式）：menubar 不参与拖拽，弹层 fixed 挂窗口坐标 —— */
      .menubar { display: flex; align-items: center; gap: 1px; -webkit-app-region: no-drag; margin-left: 6px; }
      .mb-item {
        height: 24px; padding: 2px 9px; background: transparent; border: none; border-radius: 6px;
        color: #9aa4b2; font-size: 12.5px; cursor: pointer;
      }
      .mb-item:hover, .mb-item.on { color: #e6edf3; background: #21262d; }
      .mb-pop {
        position: fixed; z-index: 95; min-width: 240px; padding: 5px;
        background: #161921; border: 1px solid #30363d; border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0,0,0,.55);
        -webkit-app-region: no-drag;
      }
      .mb-row {
        display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 7px;
        color: #c9d1d9; font-size: 12.5px; cursor: pointer; white-space: nowrap;
      }
      .mb-row:hover { background: #1f6feb33; color: #fff; }
      .mb-row.dis { opacity: 0.45; cursor: default; }
      .mb-row.dis:hover { background: transparent; color: #c9d1d9; }
      .mb-check { width: 14px; flex: none; color: #3fb950; font-size: 11.5px; }
      .mb-accel { margin-left: auto; padding-left: 22px; color: #6e7681; font-size: 11px; }
      .mb-sep { height: 1px; background: #262a33; margin: 5px 8px; }
      .app { display: flex; flex: 1; min-height: 0; }
      aside {
        width: 272px; min-width: 272px; max-width: 272px;
        border-right: 1px solid #262a33; background: #0f1218;
        display: flex; flex-direction: column; overflow: hidden;
      }
      /* 模式内容区：自己滚动，底部按钮/用户栏固定在文档流里不再悬浮重叠 */
      .aside-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
      .aside-body > .ft { flex: 1; min-height: 0; }
      aside h3 { font-size: 11.5px; color: #7d8590; margin: 16px 14px 6px; text-transform: uppercase; letter-spacing: .06em; }
      aside .newbtn { margin: 12px 14px 4px; width: calc(100% - 28px); }
      /* 会话模式标题行：标题 + 时间/分组切换 + 项目入口 */
      .side-head { display: flex; align-items: center; gap: 8px; margin: 16px 14px 0; }
      .side-head h3 { margin: 0; flex: 1; }
      .side-head .seg { margin: 0; }
      .side-head .seg button { padding: 2px 8px; font-size: 11px; }
      .side-ic {
        flex: none; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
        background: none; border: 1px solid transparent; border-radius: 6px; color: #7d8590; cursor: pointer; padding: 0;
      }
      .side-ic:hover { color: #d7dae0; background: #1c2230; }
      .side-ic.on { color: #79c0ff; border-color: #30363d; background: #161b22; }
      /* 代码面板顶部的当前项目栏：点击选目录 */
      .proj-bar {
        flex: none; display: flex; align-items: center; gap: 6px;
        margin: 10px 14px 0; padding: 6px 9px;
        border: 1px solid #30363d; border-radius: 6px; cursor: pointer;
        font-size: 12px; color: #d7dae0;
      }
      .proj-bar:hover { border-color: #4493f8; background: #161b22; }
      .proj-bar-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .proj-bar-act { flex: none; color: #79c0ff; font-size: 11px; }
      aside .search {
        margin: 8px 14px 0; width: calc(100% - 28px);
        background: #0d1017; color: #d7dae0; border: 1px solid #30363d;
        border-radius: 6px; padding: 6px 10px; font-size: 12.5px; outline: none;
      }
      aside .sess {
        position: relative; padding: 7px 14px; cursor: pointer; font-size: 12.5px; color: #8b949e;
        display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0;
      }
      aside .sess:hover { background: #161b22; }
      aside .sess .actions { display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: #0f1218; border-radius: 6px; padding: 1px 2px; }
      aside .sess:hover .actions { display: flex; }
      aside .sess:hover .smeta { visibility: hidden; }
      aside .icon {
        display: flex; align-items: center; justify-content: center;
        width: 22px; height: 22px; padding: 0;
        background: transparent; border: none; border-radius: 5px;
        color: #8b949e; cursor: pointer;
      }
      aside .icon:hover { background: #21262d; color: #d7dae0; }
      aside .icon.danger:hover { color: #f85149; background: #2a1518; }
      aside .confirm-label { font-size: 11.5px; color: #f85149; white-space: nowrap; padding: 0 3px; }
      aside .pinmark { display: inline-flex; vertical-align: -1px; margin-right: 3px; color: inherit; opacity: 0.75; }
      aside .ren {
        width: 100%; background: #0d1017; color: #d7dae0; border: 1px solid #1f6feb;
        border-radius: 4px; padding: 2px 6px; font-size: 12.5px; outline: none;
      }
      aside .sess.active { color: #79c0ff; background: #111a27; }
      aside .ghead {
        display: flex; justify-content: space-between; align-items: center;
        padding: 7px 14px 4px; color: #7d8590; font-size: 11.5px; cursor: pointer;
        position: sticky; top: 0; background: #0f1218;
      }
      aside .ghead:hover { color: #d7dae0; }

      /* —— 手动分组：扁平原生风（对标 VS Code 侧栏）——
         不做卡片底色：组间用 1px 分隔线 + 节标题，组内会话缩进并挂 1px 导轨线表明从属 —— */
      .sgroup { position: relative; padding: 2px 0 4px; transition: background .12s; }
      .sgroup + .sgroup { border-top: 1px solid #1b212c; margin-top: 3px; }
      .sgroup:last-child { margin-bottom: 8px; }
      /* 拖放反馈：整组淡蓝底 + 标题变蓝 + 导轨线变蓝，克制不抢眼 */
      .sgroup.drop { background: rgba(31,111,235,.06); }
      .sgroup.drop .gname, .sgroup.drop .gcnt { color: #79c0ff; }
      .sgroup.drop .sgroup-body::before { background: #1f6feb; }
      .sgroup-h {
        display: flex; align-items: center; gap: 5px;
        padding: 6px 14px 4px; cursor: pointer; user-select: none;
        font-size: 11.5px; color: #7d8590;
      }
      .sgroup-h:hover { color: #c9d1d9; }
      .gcaret { flex: none; width: 10px; font-size: 9px; color: #6e7681; }
      .sgroup .gname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: #9aa4b2; }
      .sgroup-h:hover .gname { color: inherit; }
      .sgroup .ren { flex: 1; min-width: 0; width: auto; }
      .sgroup .gact { flex: none; display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity .12s; }
      .sgroup-h:hover .gact { opacity: 1; }
      .gcnt { flex: none; font-size: 10.5px; color: #6e7681; font-variant-numeric: tabular-nums; }
      /* 组内导轨线：会话区缩进 + 左侧 1px 竖线，替代卡片表达从属关系 */
      .sgroup-body { position: relative; margin: 0 8px 0 20px; padding: 0 0 2px; }
      .sgroup-body::before { content: ""; position: absolute; left: 0; top: 1px; bottom: 3px; width: 1px; background: #1d232e; }
      .sgroup-body .sess { padding: 6px 8px; border-radius: 6px; }
      .sgroup-body .sess:hover { background: #161b22; }
      .sgroup-body .sess.active { background: #111a27; }

      /* —— 项目 tab（侧栏第三个 tab） —— */
      .proj-pane { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 10px; }
      .proj-card {
        margin: 10px 14px 0; padding: 10px 12px;
        background: #161921; border: 1px solid #262a33; border-radius: 10px;
      }
      .proj-label { font-size: 11px; color: #7d8590; text-transform: uppercase; letter-spacing: .06em; }
      .proj-card .proj-path {
        font-size: 13.5px; font-weight: 600; color: #d7dae0; margin-top: 3px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .proj-card .proj-full {
        font-size: 11px; color: #7d8590; margin-top: 2px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .proj-pane .sess .stitle { display: flex; align-items: center; gap: 6px; }
      .proj-pane .proj-hint { margin: auto 14px 4px; padding-top: 10px; font-size: 11px; color: #6e7681; line-height: 1.5; }
      .drop-hint {
        margin: 2px 0 0; padding: 10px 8px;
        border: 1px dashed #262d3a; border-radius: 7px;
        text-align: center; color: #6e7681; font-size: 11.5px;
        transition: border-color .12s, color .12s, background .12s;
      }
      /* 拖拽进行中：所有空组提示亮起；悬停卡内的提示转为实心可放置态 */
      .sgroup.drag-active .drop-hint { border-color: #31435f; color: #8b949e; }
      .sgroup.drop .drop-hint { border-style: solid; border-color: #1f6feb; color: #79c0ff; background: rgba(31,111,235,.09); }
      .moveselect { background: #0d1017; color: #d7dae0; border: 1px solid #1f6feb; border-radius: 4px; font-size: 11.5px; padding: 2px 4px; outline: none; }
      aside .sess[draggable="true"] { cursor: grab; }
      aside .sess.dragging { opacity: .4; }
      .ghead .ren { flex: 1; min-width: 0; }
      aside .sinfo { min-width: 0; }
      aside .stitle { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      aside .smeta { font-size: 10.5px; color: #7d8590; margin-top: 1px; }
      aside .sess .sid { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      aside .aside-footer {
        margin-top: auto; padding: 10px 12px; border-top: 1px solid #262a33;
        display: flex; align-items: center; gap: 9px; min-width: 0;
      }
      .avatar {
        width: 28px; height: 28px; min-width: 28px; border-radius: 50%;
        background: linear-gradient(135deg, #1f6feb, #a371f7);
        display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff;
      }
      .acct { flex: 1; min-width: 0; }
      .acct .name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .acct .sub { font-size: 10.5px; color: #7d8590; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .gear { width: 32px; min-width: 32px; padding: 5px 0; text-align: center; font-size: 14px; }

      .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
      /* —— 工作台三栏（IDE-DESIGN.md M0）：侧栏 | 编辑器列 | 对话列 —— */
      .ide { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .ide-body { flex: 1; display: flex; min-height: 0; position: relative; }
      /* 对话模式（actbar 会话键切出）：纵向排布，终端以全宽底部抽屉挂在对话栏下 */
      .ide-body.chatmode { flex-direction: column; }
      .main.chat-col { height: auto; min-height: 0; }
      /* 编辑器舞台：宿主常驻 + 覆盖层空态；overflow:hidden 兜底——超长单行（压缩过的 bundle 等）不得穿到右栏 */
      .ed { position: relative; }
      .ed-stage { flex: 1; min-height: 0; display: flex; position: relative; overflow: hidden; }
      .ed-overlay { position: absolute; inset: 0; background: #0d1017; z-index: 5; display: flex; }
      .editor-col {
        flex: 1; display: flex; flex-direction: column; min-width: 260px; min-height: 0;
        background: #0d1017; border-right: 1px solid #262a33;
      }
      .col-splitter { flex: none; width: 4px; cursor: col-resize; background: transparent; }
      .col-splitter:hover, .col-splitter:active { background: rgba(121, 192, 255, 0.25); }

      /* 编辑器：tab 条 / 冲突条 / 空态 */
      .ed { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      .ed-tabs {
        display: flex; align-items: center; gap: 2px; padding: 4px 8px 4px;
        border-bottom: 1px solid #262a33; overflow-x: auto; flex: none; min-height: 34px;
      }
      .ed-tab {
        display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 7px;
        background: #161b22; border: 1px solid #262a33; color: #8b949e; font-size: 12px;
        cursor: pointer; max-width: 220px; white-space: nowrap; flex: none;
      }
      .ed-tab.on { color: #d7dae0; border-color: #38414d; background: #1c2230; }
      .ed-tab .ed-name { overflow: hidden; text-overflow: ellipsis; }
      .ed-tab .ed-name.dirty { color: #e3b341; }
      .ed-tab .ed-bin { color: #6e7681; font-size: 10.5px; }
      .ed-x { background: transparent; border: none; color: #7d8590; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
      .ed-x:hover { color: #d7dae0; }
      .ed-tool {
        flex: none; background: transparent; border: 1px solid #30363d; border-radius: 6px;
        color: #8b949e; font-size: 11.5px; padding: 3px 9px; cursor: pointer;
      }
      .ed-tool:hover:not(:disabled) { color: #d7dae0; border-color: #484f58; }
      /* AI 辅助菜单（tab 条内向上弹） */
      .ai-wrap { position: relative; flex: none; }
      .ai-wrap.ai-float { position: static; }
      .ed-floats {
        position: absolute; top: 8px; right: 16px; z-index: 30;
        display: flex; align-items: center; gap: 6px;
      }
      /* 报错总览条（VSCode overview ruler）：编辑器右侧细条，按行号比例标出 lint 诊断，点击跳转 */
      .ed-ruler { flex: none; width: 12px; position: relative; background: #0d1017; border-left: 1px solid #1c2128; overflow: hidden; }
      .ed-ruler-mark { position: absolute; left: 3px; width: 5px; border-radius: 2px; min-height: 4px; cursor: pointer; }
      .ed-ruler-mark:hover { outline: 1px solid #d7dae0aa; }
      /* md 预览模式：编辑器舞台内渲染（复用 .md 正文样式） */
      .md-preview { flex: 1; min-width: 0; overflow-y: auto; padding: 14px 22px; font-size: 13.5px; background: #0d1017; }
      .ed-tool.on { color: #79c0ff; border-color: #1f6feb; }
      .ed-tool.md-tog { display: inline-flex; align-items: center; gap: 5px; }
      .add2chat { display: inline-flex; align-items: center; padding: 4px 8px; color: #79c0ff; }
      .add2chat:hover { color: #fff; border-color: #1f6feb; background: #1f3a5f66; }
      /* 对话输入框上的引用 chip（CodeBuddy 式） */
      .chip.refchip {
        display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
        color: #79c0ff; background: #111a27; border-color: #1f3a5f;
      }
      .chip.refchip:hover { border-color: #4d5560; color: #aed2ff; }
      .chip.refchip svg { color: #79c0ff; }
      .ed-tool.ai { display: inline-flex; align-items: center; gap: 5px; color: #d2a8ff; }
      .ed-tool.ai:hover, .ed-tool.ai.on { color: #e6c9ff; border-color: #6b4fa0; }
      .ai-menu {
        position: absolute; right: 0; z-index: 50; width: 200px;
        top: calc(100% + 6px);
        background: #161921; border: 1px solid #30363d; border-radius: 10px; padding: 5px;
        box-shadow: 0 8px 28px rgba(0,0,0,.5);
      }
      .ai-item {
        display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px;
        color: #c9d1d9; font-size: 12.5px; cursor: pointer; white-space: nowrap;
      }
      .ai-item:hover { background: #1f6feb33; color: #fff; }
      /* 编辑器选区右键菜单 */
      .ctx-menu {
        position: fixed; z-index: 80; width: 190px;
        background: #161921; border: 1px solid #30363d; border-radius: 10px; padding: 5px;
        box-shadow: 0 8px 28px rgba(0,0,0,.55);
      }
      .ctx-menu .ai-item svg { color: #79c0ff; }
      .ctx-menu .msep { height: 1px; background: #30363d; margin: 5px 6px; }
      .ai-item .ft-icon, .ai-item svg { color: #d2a8ff; flex: none; }
      /* monaco 编辑器右键菜单（0.57 新菜单实现）：主题未定义 menu.* 变量时底色透明，
         菜单底下会透出编辑器文字——CSS 兜底与 yharness-dark 主题里的 menu.* 同值 */
      .context-view .monaco-menu {
        background: #161921; color: #d7dae0;
        border: 1px solid #30363d; border-radius: 8px;
        box-shadow: 0 8px 28px rgba(0,0,0,.5);
      }
      .context-view .monaco-menu .monaco-menu-option { color: #c9d1d9; }
      .context-view .monaco-menu .monaco-menu-option:hover,
      .context-view .monaco-menu .monaco-menu-option.active { background: #1f2733; color: #fff; }
      .ed-tool:disabled { opacity: 0.4; cursor: default; }
      .ed-conflict {
        display: flex; align-items: center; gap: 10px; padding: 6px 12px; flex: none;
        background: #2a230d; border-bottom: 1px solid #5a4a1a; color: #e3b341; font-size: 12.5px;
      }
      .ed-conflict button { font-size: 12px; padding: 3px 10px; }
      .ed-conflict .primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
      .ed-host-wrap { flex: 1; min-height: 0; display: flex; }
      .ed-host { flex: 1; min-width: 0; overflow: hidden; }
      .ed-empty {
        flex: 1; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center;
        color: #7d8590; font-size: 13px;
      }
      .ed-empty-t { color: #c9d1d9; }
      .ed-empty-s { font-size: 11.5px; color: #6e7681; max-width: 320px; text-align: center; line-height: 1.6; }
      .ed-empty button { font-size: 12.5px; padding: 5px 14px; }
      .ed-empty .primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }

      /* diff 视图 */
      .diff-wrap { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; position: relative; }
      /* merge 双栏允许收缩（包自带样式缺 min-width:0，超长单行会把面板撑爆穿栏）；横滚交给各栏 .cm-scroller */
      .diff-host .cm-mergeView { overflow-x: hidden; }
      .diff-host .cm-mergeViewEditors, .diff-host .cm-mergeViewEditor { min-width: 0; }
      .diff-head {
        display: flex; justify-content: space-between; gap: 10px; padding: 5px 12px; flex: none;
        color: #7d8590; font-size: 11.5px; border-bottom: 1px solid #262a33;
        font-family: Consolas, monospace;
      }
      .diff-path { color: #c9d1d9; overflow: hidden; text-overflow: ellipsis; }
      .diff-host { flex: 1; min-height: 0; overflow: hidden; }
      .diff-host .cm-mergeView { height: 100%; }
      .diff-host .cm-editor { height: 100%; font-size: 12.5px; }
      .diff-same, .diff-loading { padding: 24px; color: #6e7681; font-size: 12.5px; text-align: center; }
      /* diff 面板配色（GitHub 暗色）：绿=新增/右栏，红=删除/左栏，行内词级=深底 */
      .diff-host .cm-changedLine, .diff-host .cm-insertedLine { background: #2ea04326; }
      .diff-host .cm-deletedLine, .diff-host .cm-deletedChunk { background: #f851491c; }
      .diff-host .cm-changedText, .diff-host .cm-insertedText { background: #2ea04355; }
      .diff-host .cm-deletedText { background: #f8514940; }
      .diff-host .cm-collapsedLines {
        text-align: center; color: #7d8590; background: #161b22;
        border-top: 1px solid #262a33; border-bottom: 1px solid #262a33; padding: 2px 0; cursor: pointer;
      }
      .diff-host .cm-gutters { background: #0d1017; border-right: 1px solid #262a33; }

      /* —— 文件树（资源管理器）—— */
      .ft { display: flex; flex-direction: column; min-height: 0; flex: 1; }
      /* VSCode 式常驻活动栏：app 级竖条，收起侧栏后仍在原位 */
      .actbar {
        flex: none; width: 42px; display: flex; flex-direction: column; align-items: center;
        gap: 2px; padding: 6px 0; border-right: 1px solid #1c2128; background: #0f1218;
      }
      .actbar button {
        width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
        background: none; border: none; border-radius: 6px; color: #7d8590; cursor: pointer;
        position: relative; padding: 0;
      }
      .actbar button:hover { color: #d7dae0; background: #1c2230; }
      .actbar button.on { color: #fff; }
      .actbar button.on::before {
        content: ""; position: absolute; left: -4px; top: 7px; bottom: 7px;
        width: 2px; background: #4493f8; border-radius: 1px;
      }
      .act-badge {
        position: absolute; bottom: 1px; right: 0; background: #1f6feb; color: #fff;
        font-size: 9px; font-style: normal; border-radius: 8px; min-width: 14px; height: 14px;
        line-height: 14px; text-align: center; font-weight: 600; padding: 0 3px;
      }
      .act-spacer { flex: 1; }
      .ft-toolbar { display: flex; align-items: center; gap: 8px; padding: 0 12px 8px; }
      .ft-toolbar .seg.mini button { padding: 2px 10px; font-size: 11.5px; }
      /* 资源管理器标题栏：左标题 + 右侧常驻操作（新建文件/文件夹、刷新、折叠、收起） */
      .ft-head {
        display: flex; align-items: center; justify-content: space-between; gap: 6px;
        padding: 4px 8px 4px 12px; flex: none; min-height: 26px;
        letter-spacing: .05em;
      }
      .ft-head-title { font-size: 11px; color: #9aa4b2; text-transform: uppercase; user-select: none; }
      .ft-head-acts { display: inline-flex; align-items: center; gap: 1px; }
      .ft-head-acts .ft-b { padding: 2px 4px; }
      .ft-tree { flex: 1; overflow-y: auto; min-height: 0; padding-bottom: 10px; }
      .ft-row {
        display: flex; align-items: center; gap: 5px; padding: 3px 8px; cursor: pointer;
        color: #c9d1d9; font-size: 12.5px; white-space: nowrap; position: relative;
        transition: background .4s ease;
      }
      .ft-row:hover { background: #1c2230; }
      /* 「定位文件」命中行：加类淡入、1.6s 后移除淡出 */
      .ft-row.flash { background: #1f3a5f; }
      .ft-row .ft-chev { width: 10px; color: #7d8590; flex: none; font-size: 10px; }
      .ft-row .ft-icon { color: #7d8590; display: inline-flex; flex: none; }
      .ft-row .ft-name { overflow: hidden; text-overflow: ellipsis; }
      .ft-row.touched .ft-name { color: #79c0ff; }
      .ft-dot { width: 6px; height: 6px; border-radius: 50%; background: #4493f8; flex: none; }
      .ft-git { font-size: 10.5px; font-weight: 600; flex: none; font-family: Consolas, monospace; }
      .ft-acts { margin-left: auto; display: none; gap: 2px; align-items: center; flex: none; }
      .ft-row:hover .ft-acts { display: inline-flex; }
      .ft-b {
        background: transparent; border: none; color: #7d8590; cursor: pointer;
        padding: 1px 4px; border-radius: 4px; line-height: 1; display: inline-flex;
      }
      .ft-b:hover { color: #d7dae0; background: #2a2f37; }
      .ft-b:disabled { opacity: 0.5; cursor: default; }
      .ft-b.danger { color: #f85149; }
      .ft-ren {
        flex: 1; min-width: 60px; background: #0d1017; border: 1px solid #1f6feb; border-radius: 5px;
        color: #d7dae0; font-size: 12px; padding: 1px 6px; outline: none;
      }
      .ft-empty { color: #6e7681; font-size: 11.5px; padding: 6px 8px; }
      .ft-search { padding: 2px 8px 8px; }
      .ft-search input {
        width: 100%; background: #0d1017; border: 1px solid #30363d; border-radius: 7px;
        color: #d7dae0; font-size: 12px; padding: 5px 9px; outline: none;
      }
      .ft-search input:focus { border-color: #1f6feb; }
      .ft-smeta { color: #6e7681; font-size: 11px; padding: 0 10px 6px; }
      .ft-ghead {
        color: #7d8590; font-size: 11px; padding: 6px 10px 2px;
        text-transform: uppercase; letter-spacing: .05em;
      }
      .ft-spath {
        display: flex; align-items: center; gap: 5px; padding: 4px 10px; color: #79c0ff;
        font-size: 12px; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      }
      .ft-spath:hover { text-decoration: underline; }
      .ft-hit {
        display: flex; gap: 8px; padding: 2px 10px 2px 26px; color: #8b949e; font-size: 11.5px;
        cursor: pointer; font-family: Consolas, monospace; white-space: nowrap; overflow: hidden;
      }
      .ft-hit:hover { background: #1c2230; color: #c9d1d9; }
      .ft-ln { color: #6e7681; min-width: 26px; text-align: right; flex: none; }
      .ft-htext { overflow: hidden; text-overflow: ellipsis; }

      /* 本次任务改动浮条 */
      .runbar {
        display: flex; align-items: center; gap: 6px; margin: 6px 14px 0; padding: 5px 12px;
        background: #111a27; border: 1px solid #1f3a5f; border-radius: 9px; flex-wrap: wrap; flex: none;
      }
      .runbar-label { color: #79c0ff; font-size: 12px; }
      .runbar-chip {
        background: #1c2230; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9;
        font-size: 11.5px; padding: 2px 8px; cursor: pointer; max-width: 160px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .runbar-chip:hover { border-color: #4d5560; color: #fff; }
      .runbar-clear { background: transparent; border: none; color: #7d8590; cursor: pointer; padding: 2px; }

      /* 工具卡片可跳转 */
      .tool.jump { cursor: pointer; }
      .tool.jump:hover { border-color: #4d5560; }

      /* —— 左侧消息导航（outline）：悬停浮现，点击跳转 —— */
      .outline-nav {
        position: absolute; left: 10px; top: 54px; bottom: 150px; width: 26px;
        display: flex; flex-direction: column; gap: 5px; align-items: flex-start;
        opacity: 0; transition: opacity 0.15s; z-index: 20; overflow: hidden;
      }
      .main:hover .outline-nav { opacity: 0.45; }
      .outline-nav:hover { opacity: 1; }
      .obar { height: 3px; border-radius: 2px; background: #6e7681; cursor: pointer; flex: none; }
      .obar.me { background: #9da7b3; }
      .obar:hover { background: #e6edf3; }
      .outline-tip {
        position: absolute; left: 42px; z-index: 30; pointer-events: none;
        background: #1c2128; border: 1px solid #30363d; border-radius: 8px;
        padding: 9px 12px; max-width: 300px; max-height: 180px; overflow: hidden;
        font-size: 12px; line-height: 1.5; color: #c9d1d9; white-space: pre-wrap;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      /* —— Markdown 渲染（助手消息） —— */
      .md { line-height: 1.6; white-space: normal; }
      .md > :first-child { margin-top: 0; }
      .md > :last-child { margin-bottom: 0; }
      .md p { margin: 8px 0; }
      .md h1, .md h2, .md h3, .md h4 { margin: 14px 0 8px; line-height: 1.35; }
      .md h1 { font-size: 1.25em; }
      .md h2 { font-size: 1.15em; }
      .md h3, .md h4 { font-size: 1.05em; }
      .md ul, .md ol { margin: 8px 0; padding-left: 22px; }
      .md li { margin: 3px 0; }
      .md code {
        background: #21262d; border: 1px solid #30363d; border-radius: 4px;
        padding: 1px 5px; font-family: Consolas, monospace; font-size: 0.92em;
      }
      .md pre {
        background: #0d1017; border: 1px solid #262a33; border-radius: 8px;
        padding: 10px 12px; overflow-x: auto; margin: 10px 0;
      }
      .md pre code { background: none; border: none; padding: 0; font-size: 12.5px; }
      .md blockquote { border-left: 3px solid #30363d; margin: 8px 0; padding: 2px 12px; color: #8b949e; }
      .md a { color: #79c0ff; }
      /* 回答中的行号引用（path:114 / 第 114-120 行）：点击跳编辑器对应行 */
      .md-jump {
        color: #79c0ff; cursor: pointer;
        border-bottom: 1px dashed #79c0ff66;
      }
      .md-jump:hover { background: #79c0ff22; border-bottom-color: #79c0ff; }
      /* 源代码管理（Git 面板） */
      .ft-git { padding: 8px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
      .git-msg {
        background: #0d1017; border: 1px solid #30363d; border-radius: 6px; color: #d7dae0;
        padding: 6px 8px; font-size: 12px; resize: vertical; font-family: inherit;
      }
      .git-msg:focus { outline: none; border-color: #4493f8; }
      .git-msg-row { display: flex; gap: 6px; align-items: stretch; }
      .git-msg-row .git-msg { flex: 1; }
      /* 生成提交信息：输入框内右侧小图标（VSCode 式），无边框底色 */
      .git-msg-wrap { position: relative; flex: 1; display: flex; }
      .git-msg-wrap .git-msg { flex: 1; width: 100%; padding-right: 28px; }
      .git-gen {
        position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
        width: 22px; height: 22px; padding: 0; display: flex; align-items: center; justify-content: center;
        background: none; border: none; border-radius: 5px; color: #d2a8ff; cursor: pointer;
      }
      .git-gen:hover:not(:disabled) { background: #2a1f3d; }
      .git-gen:disabled { opacity: 0.5; cursor: default; }
      .git-commit {
        background: #1f6feb; border: none; border-radius: 6px; color: #fff;
        padding: 6px 0; font-size: 12.5px; cursor: pointer;
      }
      .git-commit:hover:not(:disabled) { background: #388bfd; }
      .git-commit:disabled { opacity: 0.45; cursor: default; }
      /* 分体式：主按钮「提交」+ 右侧窄按钮「提交并推送」 */
      .git-commit-row { display: flex; }
      .git-commit-row .git-commit { flex: 1; border-radius: 6px 0 0 6px; }
      .git-commit-alt {
        flex: none; width: 34px; display: flex; align-items: center; justify-content: center;
        background: #1f6feb; border: none; border-left: 1px solid #0d1017; border-radius: 0 6px 6px 0;
        color: #fff; cursor: pointer; padding: 0;
      }
      .git-commit-alt:hover:not(:disabled) { background: #388bfd; }
      .git-commit-alt:disabled { opacity: 0.45; cursor: default; }
      /* 未推送提交数徽标（推送按钮右上角小计数，VSCode ↑N 式） */
      .push-wrap { position: relative; }
      .push-badge {
        position: absolute; top: -4px; right: -5px; background: #1f6feb; color: #fff;
        font-size: 9px; font-style: normal; border-radius: 8px; min-width: 13px; height: 13px;
        line-height: 13px; text-align: center; font-weight: 600; padding: 0 3px;
      }
      .git-commit-alt .push-badge { background: #0d1017; border: 1px solid #ffffff2e; top: -5px; right: -6px; }
      .git-branch { color: #8b949e; font-size: 11.5px; margin-top: 4px; }
      .git-sec { color: #8b949e; font-size: 11.5px; margin-top: 6px; display: flex; gap: 6px; align-items: center; justify-content: space-between; }
      .git-sec b { color: #d7dae0; }
      .git-sec-act {
        width: 18px; height: 18px; line-height: 16px; text-align: center; cursor: pointer;
        border: 1px solid #30363d; border-radius: 4px; color: #8b949e; font-size: 11px;
      }
      .git-sec-act:hover { color: #d7dae0; border-color: #4493f8; }
      .git-row {
        display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 4px;
        cursor: pointer; font-size: 12px; min-width: 0;
      }
      .git-row:hover { background: #161b22; }
      .git-badge { flex: none; width: 12px; text-align: center; font-weight: 600; }
      .git-name { color: #d7dae0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .git-dir { color: #6e7681; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
      .git-act {
        flex: none; width: 18px; height: 18px; line-height: 16px; text-align: center;
        border: 1px solid #30363d; border-radius: 4px; color: #8b949e; visibility: hidden;
      }
      .git-row:hover .git-act { visibility: visible; }
      .git-act:hover { color: #d7dae0; border-color: #4493f8; }
      .md table { border-collapse: collapse; margin: 10px 0; display: block; overflow-x: auto; max-width: 100%; }
      .md th, .md td { border: 1px solid #30363d; padding: 5px 12px; font-size: 13px; text-align: left; }
      .md th { background: #161921; font-weight: 600; }
      .md hr { border: none; border-top: 1px solid #30363d; margin: 12px 0; }
      header {
        display: flex; align-items: center; gap: 10px; flex: none;
        padding: 8px 14px; border-bottom: 1px solid #262a33; background: #161921;
      }
      header .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
      header .dot.ok { background: #3fb950; }
      header .dot.bad { background: #f85149; }
      header .title { font-weight: 600; }
      header .title.topic {
        font-size: 14.5px; max-width: 40%; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap;
      }
      .seg { display: flex; gap: 4px; margin: 8px 14px; flex: none; }
      .seg button { flex: 1; font-size: 11.5px; padding: 4px 0; background: #161921; }
      .seg button.on { background: #1f2733; color: #fff; border-color: #3a424c; }
      header .meta { color: #7d8590; font-size: 12px; }

      #msgs { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 16px; }
      /* 左侧导航槽：导航存在时给内容让位，条子不再压正文 */
      #msgs.with-nav { padding-left: 48px; }
      .msg { line-height: 1.5; white-space: pre-wrap; word-break: break-word; position: relative; }
      /* 消息操作行（ZCode 式）：复制/分支跟在消息下方的文档流里，不再悬浮压字、不会点不到 */
      .msg-foot { display: flex; align-items: center; gap: 2px; margin-top: 3px; }
      .user-foot { justify-content: flex-end; min-height: 22px; opacity: 0; transition: opacity 0.12s; }
      .msg.user:hover .user-foot { opacity: 1; }
      .mact {
        display: flex; align-items: center; justify-content: center;
        width: 22px; height: 22px; padding: 0;
        background: transparent; border: none; border-radius: 5px;
        color: #6e7681; cursor: pointer;
      }
      .mact:hover { color: #79c0ff; background: #21262d; }
      .msg.user { align-self: flex-end; max-width: 78%; margin-top: 12px; }
      .msg.user .bubble {
        background: #1c2540; border: 1px solid #1f3a5f; color: #c9d7ff;
        padding: 9px 13px; border-radius: 14px 14px 4px 14px;
      }
      .bubble .imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
      .bubble .imgs img { width: 140px; max-height: 100px; object-fit: cover; border-radius: 8px; display: block; cursor: zoom-in; }
      .lightbox {
        position: fixed; inset: 0; background: rgba(0,0,0,.78); z-index: 60;
        display: flex; align-items: center; justify-content: center; cursor: zoom-out;
      }
      .lightbox img { max-width: 92%; max-height: 92%; border-radius: 8px; }
      /* 切换项目遮罩：daemon 重启期间提示进度，避免「连接断开」看起来像失败 */
      .switching-mask {
        position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 70;
        display: flex; align-items: center; justify-content: center;
      }
      .switching-card {
        background: #161921; border: 1px solid #30363d; border-radius: 12px;
        padding: 22px 30px; display: flex; flex-direction: column; gap: 8px; align-items: center;
        color: #d7dae0; font-size: 13.5px;
      }
      .switching-card .meta { color: #7d8590; font-size: 12px; }
      .switching-card .spin {
        width: 18px; height: 18px; border-radius: 50%;
        border: 2px solid #30363d; border-top-color: #79c0ff;
        animation: rot 1s linear infinite;
      }
      .working {
        /* 占满整行：fit-content 定宽在嵌套 flex 下会被算窄，挤得思考行逐字换行 */
        align-self: stretch;
        display: flex; flex-direction: column; gap: 6px;
      }
      .working-head {
        color: #7d8590; font-size: 12.5px;
        display: flex; gap: 8px; align-items: center;
      }
      .working-head .spin, .thinking-line .spin {
        width: 12px; height: 12px; border-radius: 50%;
        border: 2px solid #30363d; border-top-color: #79c0ff;
        animation: rot 1s linear infinite;
        flex: none;
      }
      @keyframes rot { to { transform: rotate(360deg); } }
      /* ZCode 式实时思考区：推理全文流式显示，高度封顶内部滚动 */
      .think-live {
        align-self: stretch; max-height: 220px; overflow-y: auto;
        border-left: 2px solid #30363d; padding: 2px 0 2px 10px;
      }
      .think-live pre {
        margin: 0; font-family: inherit; font-size: 12.5px; line-height: 1.55;
        color: #8b949e; white-space: pre-wrap; word-break: break-word;
      }
      .msg.assistant { align-self: flex-start; max-width: 94%; color: #d7dae0; }
      .msg.notice { align-self: center; color: #d2a8ff; font-size: 12px; background: #161921; border-radius: 999px; padding: 3px 14px; }
      .msg.error { align-self: stretch; color: #f85149; }
      .dur { font-size: 11px; color: #7d8590; }
      .msg-foot .dur { margin-left: 5px; }
      .tool {
        align-self: flex-start; max-width: 94%;
        font-family: Consolas, monospace; font-size: 12.5px; color: #8b949e;
        border: 1px solid #262a33; border-radius: 6px; padding: 6px 10px; background: #161921;
        display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; min-width: 0;
      }
      .tool .ticon { display: inline-flex; align-items: center; color: #7d8590; }
      .tool .tverb { color: #d7dae0; }
      .tool .ttarget { color: #8b949e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 460px; }
      .tool .tadd { color: #3fb950; }
      .tool .tstatus { margin-left: auto; }
      .tool.done { color: #3fb950; }
      /* 失败：卡片保持中性色，仅状态字柔和红（UI 字体），错误详情在悬浮提示 */
      .tool.fail { color: #8b949e; }
      .tool .tstatus.fail {
        color: #ff7b72; font-weight: 400;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        font-size: 12px; letter-spacing: 0.2px;
      }
      /* 用户主动停止：中性灰弱化（不是错误），状态字用 UI 字体去等宽感 */
      .tool.stopped { color: #6e7681; }
      .tool.stopped .ticon { color: #6e7681; }
      .tool .tstatus.stopped {
        color: #7d8590; font-weight: 400;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        font-size: 12px; letter-spacing: 0.2px;
      }
      .act-think {
        align-self: flex-start; display: flex; gap: 6px; align-items: center;
        color: #7d8590; font-size: 12.5px; padding: 2px 0; max-width: 94%;
        white-space: nowrap;
      }
      .tool.live { color: #c9d1d9; }
      .tool.live .ticon { color: #79c0ff; }
      .tool .tstatus { margin-left: auto; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
      /* 运行中卡片的持续动画：命令安静期也能看出「还在干活」 */
      .tool .spin {
        width: 10px; height: 10px; border-radius: 50%; flex: none;
        border: 2px solid #30363d; border-top-color: #79c0ff;
        animation: rot 1s linear infinite;
      }
      .tool .ttarget.raw { color: #6e7681; max-width: 380px; }
      .tool .tout {
        flex-basis: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        color: #7d8590; font-size: 11.5px; border-top: 1px dashed #262a33; padding-top: 4px; margin-top: 2px;
      }
      .act-think-wrap { align-self: flex-start; max-width: 94%; }
      .act-think.clickable { cursor: pointer; user-select: none; }
      .act-think.clickable:hover { color: #c9d1d9; }
      .act-think .think-chev { font-size: 10px; }
      .think-full {
        margin: 2px 0 6px; padding: 6px 12px; max-height: 260px; overflow-y: auto;
        border-left: 2px solid #262a33; color: #8b949e; font-size: 12px; line-height: 1.55;
        white-space: pre-wrap; word-break: break-word;
      }

      /* —— 运行中排队消息：悬停在输入框上方（ZCode 式） —— */
      .queue-row {
        margin: 0 14px 8px; display: flex; align-items: center; gap: 8px;
        background: #161921; border: 1px solid #30363d; border-radius: 10px; padding: 8px 12px;
        flex: none;
      }
      .queue-row .qtext {
        flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-size: 13px; color: #c9d1d9;
      }
      .qbtn {
        background: transparent; border: 1px solid #30363d; color: #8b949e; border-radius: 6px;
        padding: 3px 8px; font-size: 12px; cursor: pointer;
        display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
      }
      .qbtn:hover { color: #d7dae0; border-color: #484f58; }
      .qbtn.primary { color: #79c0ff; }
      .perm { border: 1px solid #d29922; border-radius: 8px; padding: 12px 14px; background: #241f14; }
      .perm .reason { color: #d29922; font-size: 12.5px; margin: 6px 0 10px; }
      .perm button { margin-right: 8px; }
      .cursor { display: inline-block; width: 7px; height: 15px; background: #d7dae0; animation: blink 1s step-end infinite; vertical-align: text-bottom; }
      @keyframes blink { 50% { opacity: 0; } }

      /* —— 输入区（ZCode 式） —— */
      .composer {
        margin: 10px 14px 12px; border: 1px solid #30363d; border-radius: 12px;
        background: #0d1017; padding: 10px 12px 8px; flex: none;
      }
      /* —— 内嵌终端（编辑器下方抽屉，VS Code/ZCode 式）—— */
      /* 面板开关组（CodeBuddy 式：左侧栏 / 终端 / 对话栏），对话栏收起后浮在编辑器右上角 */
      .panel-toggles { display: inline-flex; align-items: center; gap: 2px; }
      .panel-toggles button {
        width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
        background: transparent; border: none; border-radius: 6px; color: #7d8590; cursor: pointer; padding: 0;
      }
      .panel-toggles button:hover { color: #d7dae0; background: #21262d; }
      .panel-toggles button.on { color: #79c0ff; background: #111a27; }
      .term-toggle {
        margin-left: auto; background: transparent; border: 1px solid transparent; border-radius: 6px;
        color: #7d8590; cursor: pointer; padding: 3px 7px; display: inline-flex; align-items: center;
      }
      .term-toggle:hover { color: #d7dae0; border-color: #30363d; }
      .term-toggle.on { color: #79c0ff; border-color: #1f3a5f; background: #111a27; }
      /* —— 上下文容量：顶栏圆环 + 弹出卡片（ZCode 式）—— */
      .ctx-chip {
        display: inline-flex; align-items: center; gap: 5px;
        background: transparent; border: none; border-radius: 999px;
        color: #7d8590; font-size: 11.5px; padding: 3px 8px; cursor: pointer; margin-left: 10px;
        white-space: nowrap; font-family: Consolas, monospace;
      }
      .ctx-chip:hover, .ctx-chip.on { color: #c9d1d9; background: #1c2230; }
      /* 对话栏头部：新建/历史/搜索（TRAE 式图标按钮）——图标提亮到中灰上，深底上才看得见 */
      .head-ic {
        flex: none; display: inline-flex; align-items: center; justify-content: center;
        width: 28px; height: 28px; margin-left: 4px;
        background: #1c2230; border: 1px solid #262d38; border-radius: 7px;
        color: #c5ced8; cursor: pointer;
      }
      .head-ic:hover { color: #e6edf3; background: #242b36; border-color: #30363d; }
      /* 输入框上方用量条：最近一次对话耗时/token + 会话累计 */
      .usage-strip {
        display: flex; align-items: center; gap: 14px;
        padding: 3px 14px 0; font-size: 11.5px; color: #7d8590; white-space: nowrap; overflow: hidden;
      }
      .usage-strip span { display: inline-flex; align-items: center; gap: 4px; font-family: Consolas, monospace; }
      .usage-strip .us-live { color: #79c0ff; }
      /* 代码模式：用量条行首的上下文圆环（顶栏不再显示；小一号、无左距，与 token 统计同行） */
      .usage-strip .ctx-mini {
        margin-left: 0; padding: 1px 7px; gap: 4px; font-size: 11px; flex: none;
        border-radius: 999px; color: #8b949e;
      }
      .usage-strip .ctx-mini:hover, .usage-strip .ctx-mini.on { background: #1c2230; color: #c9d1d9; }
      /* —— 代码模式「历史对话」面板（CodeBuddy 式）：覆盖对话区，返回按钮关闭；
          与会话模式的左侧会话栏完全独立 —— */
      .hist-panel {
        position: absolute; top: 44px; left: 0; right: 0; bottom: 0; z-index: 58;
        display: flex; flex-direction: column; background: #111318;
      }
      .hist-panel .hist-top {
        display: flex; align-items: center; gap: 12px; flex: none;
        padding: 8px 14px; border-bottom: 1px solid #262a33;
      }
      .hist-panel .hist-back {
        background: transparent; border: 1px solid #30363d; border-radius: 7px;
        color: #9da7b3; font-size: 12.5px; padding: 3px 10px; cursor: pointer;
      }
      .hist-panel .hist-back:hover { color: #e6edf3; border-color: #484f58; }
      .hist-panel .hist-title { font-weight: 600; font-size: 13.5px; color: #e6edf3; }
      .hist-panel .hist-search { padding: 10px 14px 6px; flex: none; }
      .hist-panel .hist-search input {
        width: 100%; background: #161921; border: 1px solid #30363d; border-radius: 8px;
        color: #d7dae0; padding: 7px 10px; font-size: 12.5px; outline: none;
      }
      .hist-panel .hist-search input:focus { border-color: #38414d; }
      .hist-panel .hist-list { flex: 1; overflow-y: auto; padding: 4px 8px 14px; }
      .hist-panel .hist-ghead {
        display: flex; justify-content: space-between; color: #7d8590; font-size: 11.5px;
        padding: 8px 8px 4px;
      }
      .hist-panel .sess { padding: 7px 10px; border-radius: 8px; cursor: pointer; }
      .hist-panel .sess:hover { background: #1c2230; }
      .hist-panel .sess.active { background: #16233a; }
      .hist-panel .sess .stitle { color: #c9d1d9; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hist-panel .sess.active .stitle { color: #79c0ff; }
      .hist-panel .sess .smeta { color: #6e7681; font-size: 11px; margin-top: 2px; font-family: Consolas, monospace; }
      .hist-panel .hist-cur {
        display: inline-block; margin-left: 8px; padding: 0 6px; border-radius: 5px;
        border: 1px solid rgba(63, 185, 80, 0.5); color: #3fb950; font-size: 10.5px;
      }
      .hist-panel .hist-empty { padding: 14px; color: #6e7681; font-size: 12px; }
      .ctx-pop {
        position: absolute; top: 44px; right: 14px; z-index: 55; width: 320px;
        background: #161921; border: 1px solid #30363d; border-radius: 12px;
        padding: 14px 16px; box-shadow: 0 8px 28px rgba(0,0,0,.5);
        display: flex; flex-direction: column; gap: 8px;
      }
      /* 代码模式：触发点在输入框上方用量条 → 详情卡从底部向上弹（否则跑到 header 下面）。
         bottom 覆盖 composer+用量条高度，留缝不遮圆环 */
      .ctx-pop.up {
        top: auto; bottom: 150px;
      }
      .ctx-head { display: flex; justify-content: space-between; align-items: baseline; color: #d7dae0; font-size: 13px; font-weight: 600; }
      .ctx-head .ctx-nums { font-size: 12px; font-weight: 400; color: #8b949e; font-family: Consolas, monospace; }
      .ctx-bar { height: 6px; border-radius: 999px; background: #21262d; overflow: hidden; }
      .ctx-fill { height: 100%; border-radius: 999px; transition: width .3s; }
      .ctx-row {
        display: flex; justify-content: space-between; color: #8b949e; font-size: 12.5px;
      }
      .ctx-row b { color: #c9d1d9; font-family: Consolas, monospace; font-weight: 400; }
      .ctx-row .cdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
      .ctx-note { border-top: 1px solid #262a33; padding-top: 8px; color: #6e7681; font-size: 11px; line-height: 1.5; }
      .term-panel {
        position: relative; flex: none; display: flex; flex-direction: column;
        border-top: 1px solid #30363d; background: #111318; min-width: 0;
      }
      .editor-col .term-panel { border-left: none; border-right: none; }
      .term-resize {
        height: 6px; flex: none; cursor: row-resize; margin-top: -1px;
      }
      .term-resize:hover { background: rgba(121, 192, 255, 0.18); }
      .term-head {
        display: flex; align-items: center; gap: 6px; padding: 6px 10px 4px;
        border-bottom: 1px solid #262a33; flex: none;
      }
      .term-label { display: inline-flex; align-items: center; gap: 5px; color: #7d8590; font-size: 12px; margin-right: 4px; }
      .term-tab {
        display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 7px;
        background: #161b22; border: 1px solid #262a33; color: #8b949e; font-size: 12px; cursor: pointer;
        max-width: 180px;
      }
      .term-tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .term-tab.on { color: #d7dae0; border-color: #38414d; background: #1c2230; }
      .term-tab .term-x, .term-new, .term-head > .term-x {
        background: transparent; border: none; color: #7d8590; cursor: pointer;
        font-size: 15px; line-height: 1; padding: 2px 7px; border-radius: 5px;
      }
      .term-tab .term-x:hover, .term-new:hover, .term-head > .term-x:hover {
        color: #d7dae0; background: #2a2f37;
      }
      .term-new:hover { color: #d7dae0; background: #21262d; }
      .term-host { flex: 1; min-height: 0; padding: 4px 8px 6px; }
      .term-host .xterm, .term-host .xterm .xterm-viewport { height: 100%; }
      .term-empty {
        position: absolute; inset: 40px 0 0; display: flex; align-items: center; justify-content: center;
      }
      .composer textarea {
        width: 100%; background: transparent; color: #d7dae0; border: none; outline: none;
        font-size: 14px; resize: none; line-height: 1.5; padding: 2px; display: block;
      }
      /* 输入框引用卡片镜像层：垫在 textarea 底下，文本透明只留卡片底色（CodeBuddy 式引用卡）。
         与 textarea 同字体/行高/内边距；宽度由 JS 同步为 textarea clientWidth（滚动条出现时换行仍一致）。
         textarea 必须 relative+z-index:1 压在镜像上：定位元素默认画在普通流内容之上，
         否则卡片底色会盖住输入的文字 */
      .input-stack { position: relative; display: block; }
      .input-stack textarea { position: relative; z-index: 1; }
      .input-mirror {
        position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: hidden;
        font-size: 14px; line-height: 1.5; padding: 2px; color: transparent;
        white-space: pre-wrap; word-wrap: break-word;
      }
      .refpill { background: #132a45; border-radius: 6px; box-shadow: inset 0 0 0 1px #1f4d7a; }
      /* —— 编辑器右键菜单（自绘，CodeBuddy 式：文本 + 快捷键右对齐 + 分组分隔线） —— */
      .edmenu {
        position: fixed; z-index: 96; min-width: 236px; max-height: 70vh; overflow-y: auto;
        background: #1c2128; border: 1px solid #30363d; border-radius: 10px; padding: 5px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .edmenu .mi {
        display: flex; align-items: center; justify-content: space-between; gap: 18px;
        padding: 5px 10px; border-radius: 6px; font-size: 12.5px; color: #c9d1d9;
        cursor: default; white-space: nowrap;
      }
      .edmenu .mi.on { background: #242b36; }
      .edmenu .mi.dis { color: #57606a; }
      .edmenu .mi.dis.on { background: transparent; }
      .edmenu .ml { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
      .edmenu .kb { color: #6e7681; font-size: 11px; font-family: Consolas, monospace; flex: none; }
      .edmenu .msep { height: 1px; background: #30363d; margin: 5px 6px; }
      /* —— 引用查找结果面板（查找所有引用 / 转到引用） —— */
      .refpanel {
        position: fixed; z-index: 95; width: min(560px, 90vw); max-height: 50vh;
        display: flex; flex-direction: column;
        background: #1c2128; border: 1px solid #30363d; border-radius: 10px; overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .refpanel .rp-head { padding: 8px 12px; font-size: 12px; color: #8b949e; border-bottom: 1px solid #262a33; }
      .refpanel .rp-head b { color: #79c0ff; }
      .refpanel .rp-list { overflow-y: auto; padding: 4px; }
      .refpanel .rp-row {
        display: flex; align-items: baseline; gap: 10px; padding: 4px 8px; border-radius: 6px; cursor: pointer;
      }
      .refpanel .rp-row:hover { background: #242b36; }
      .refpanel .rp-loc { color: #79c0ff; font-family: Consolas, monospace; font-size: 12px; white-space: nowrap; flex: none; }
      .refpanel .rp-text { color: #8b949e; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .refpanel .rp-empty { padding: 14px 12px; color: #6e7681; font-size: 12px; }
      .controls { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: nowrap; min-width: 0; }
      .controls.compact { gap: 4px; margin-top: 4px; }
      .controls.compact .ctl { padding: 3px 6px; font-size: 11.5px; }
      .controls .ctl.model { flex: 1 1 auto; min-width: 88px; max-width: 170px; }
      .pchip.iconly { padding: 4px 8px; }
      /* 窄对话栏：头部单行，标题截断，不允许换行堆叠 */
      .chat-col header { flex-wrap: nowrap; overflow: hidden; }
      .chat-col header .title.topic { flex: 1 1 auto; min-width: 0; }
      /* —— 会话模式（全宽大对话，.chat-wide）：独立于代码模式窄栏的布局形态 ——
         消息流/用量条/输入框限宽居中成同一内容列，composer 是居中的大输入框（ZCode/ChatGPT 式），
         代码模式窄栏样式完全不受影响 */
      .chat-wide header { max-width: 920px; width: 100%; margin: 0 auto; padding: 10px 18px; background: transparent; }
      .chat-wide #msgs { align-items: center; padding: 18px 24px; }
      .chat-wide #msgs > * { width: 100%; max-width: 860px; }
      /* 消息导航条与内容列拉开间距（ZCode 式，不再贴着正文） */
      .chat-wide #msgs.with-nav { padding-left: 130px; }
      .chat-wide .usage-strip { width: calc(100% - 48px); max-width: 860px; margin: 0 auto; padding: 3px 0 0; }
      .chat-wide .composer {
        width: calc(100% - 48px); max-width: 860px; margin: 10px auto 18px;
        padding: 14px 18px 10px; border-radius: 16px;
      }
      .chat-wide .composer textarea, .chat-wide .input-mirror { font-size: 15px; line-height: 1.55; }
      /* 会话模式 composer 底部控件：无边框轻量化（ZCode 式简约），hover 才显形 */
      .chat-wide .controls { gap: 8px; margin-top: 8px; }
      .chat-wide .controls .ctl {
        background: transparent; border-color: transparent; color: #8b949e;
        padding: 4px 9px; border-radius: 7px;
      }
      .chat-wide .controls .ctl:hover { background: #1c2230; color: #d7dae0; border-color: transparent; }
      .chat-wide .controls .ctl.pchip.hot { color: #e3b341; } /* bypass 警示色不被轻量化覆盖 */
      /* 模型下拉不随 860px 宽行拉伸：按内容自适应宽度，弹出列表才不会横贯整行 */
      .chat-wide .controls .ctl.model { flex: 0 1 auto; width: auto; min-width: 0; max-width: 220px; }
      .controls .ctl {
        background: transparent; border: 1px solid #30363d; color: #8b949e;
        border-radius: 6px; padding: 3px 9px; font-size: 12px; cursor: pointer; max-width: 240px;
      }
      .controls .ctl:hover { color: #d7dae0; border-color: #484f58; }
      .controls .ctl.model { max-width: 260px; }
      /* 思考档位：native select 左侧叠脑子图标（选择器权重必须压过 .controls .ctl 的 padding） */
      .think-select { position: relative; display: inline-flex; align-items: center; }
      .think-select > svg {
        position: absolute; left: 9px; pointer-events: none; color: #7d8590; z-index: 1;
      }
      .controls .think-select .ctl { padding-left: 28px; }

      /* —— 权限模式（ZCode 式自定义下拉） —— */
      .pdrop { position: relative; display: flex; }
      .pchip { display: inline-flex; align-items: center; gap: 6px; }
      .pchip.hot { color: #e3b341; border-color: rgba(227, 179, 65, 0.45); }
      .pchip.hot:hover { color: #e3b341; }
      .pmenu {
        position: absolute; bottom: calc(100% + 12px); left: 0; min-width: 258px;
        background: #1c2128; border: 1px solid #30363d; border-radius: 10px; padding: 5px;
        z-index: 70; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }
      .pitem {
        display: flex; gap: 10px; align-items: flex-start;
        padding: 8px 10px; border-radius: 8px; cursor: pointer;
      }
      .pitem:hover { background: #242b36; }
      .pitem .picon { color: #8b949e; display: inline-flex; margin-top: 2px; }
      .pitem .pbody { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
      .pitem .pbody b { font-size: 13px; color: #e6edf3; font-weight: 600; }
      .pitem .pbody i { font-style: normal; font-size: 11.5px; color: #7d8590; }
      .pitem .pcheck { color: #3fb950; margin-top: 2px; }
      .pitem.active { background: rgba(227, 179, 65, 0.1); }
      .pitem.active .pbody b, .pitem.active .picon { color: #e3b341; }
      .controls .send {
        width: 34px; height: 30px; border-radius: 9px; background: #1f6feb;
        border: none; color: #fff; font-size: 15px; cursor: pointer;
      }
      .controls .send:disabled { opacity: 0.4; cursor: default; }
      .controls .send.stop {
        background: #21262d; border: 1px solid #30363d; color: #d7dae0;
        display: inline-flex; align-items: center; justify-content: center;
        padding: 0;
      }
      .controls .send.stop:hover { border-color: #4d5560; background: #2a2f37; }
      /* 停止图标：CSS 画的圆角方块（ZCode 式），比文字 ■ 大且清晰 */
      .controls .send.stop .stopsq {
        width: 11px; height: 11px; background: currentColor; border-radius: 2.5px;
        display: block;
      }
      .atchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
      .atchips .chip {
        display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
        color: #79c0ff; background: #111a27; border: 1px solid #1f3a5f;
        padding: 3px 10px; border-radius: 999px;
      }
      .atchips .chipx { cursor: pointer; color: #8b949e; }
      .imgchip { padding: 3px 6px 3px 3px !important; }
      .imgchip img { height: 40px; max-width: 90px; object-fit: cover; border-radius: 5px; display: block; }
      .attach-row input {
        width: 100%; background: #161921; color: #d7dae0; border: 1px solid #30363d;
        border-radius: 6px; padding: 6px 10px; font-size: 12.5px; outline: none; margin-bottom: 6px;
      }

      /* —— 设置页 —— */
      .settings-screen { flex: 1; min-height: 0; display: flex; }
      .settings-menu { width: 260px; min-width: 260px; background: #0f1218; border-right: 1px solid #262a33; padding: 16px 12px; }
      .settings-menu .back { color: #8b949e; cursor: pointer; font-size: 13px; padding: 6px 10px; border-radius: 6px; margin-bottom: 14px; }
      .settings-menu .back:hover { color: #d7dae0; background: #161b22; }
      .perm-badge {
        margin: 0 0 12px; padding: 8px 12px; border: 1px solid #d29922;
        background: #241f14; color: #d29922; border-radius: 8px;
        font-size: 12.5px; cursor: pointer;
      }
      .settings-menu h3 { font-size: 11.5px; color: #7d8590; text-transform: uppercase; margin: 10px 8px 6px; letter-spacing: .06em; }
      .settings-menu .mitem {
        display: flex; align-items: center; gap: 9px;
        padding: 8px 12px; border-radius: 6px; cursor: pointer; color: #c9d1d9; font-size: 13.5px;
      }
      .settings-menu .mitem:hover { background: #161b22; }
