[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-harness"
version = "0.1.0"
description = "My-Harness: a from-scratch LLM agent harness (event-sourced core, tools, MCP-ready, Tauri desktop planned)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
harness = "harness.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]
